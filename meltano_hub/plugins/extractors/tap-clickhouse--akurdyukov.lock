{
  "name": "tap-clickhouse",
  "namespace": "tap_clickhouse",
  "variant": "akurdyukov",
  "label": "ClickHouse",
  "docs": "https://hub.meltano.com/extractors/tap-clickhouse--akurdyukov",
  "repo": "https://github.com/akurdyukov/tap-clickhouse",
  "pip_url": "git+https://github.com/akurdyukov/tap-clickhouse.git",
  "executable": "tap-clickhouse",
  "description": "Fast Open-Source OLAP DBMS",
  "logo_url": "https://hub.meltano.com/assets/logos/extractors/clickhouse.png",
  "capabilities": [
    "about",
    "batch",
    "catalog",
    "discover",
    "schema-flattening",
    "state",
    "stream-maps"
  ],
  "settings_group_validation": [
    [
      "password"
    ]
  ],
  "settings": [
    {
      "name": "batch_config.encoding.compression",
      "kind": "options",
      "label": "Batch Config Encoding Compression",
      "description": "Compression format to use for batch files.",
      "options": [
        {
          "label": "GZIP",
          "value": "gzip"
        },
        {
          "label": "None",
          "value": "none"
        }
      ]
    },
    {
      "name": "batch_config.encoding.format",
      "kind": "options",
      "label": "Batch Config Encoding Format",
      "description": "Format to use for batch files.",
      "options": [
        {
          "label": "JSONL",
          "value": "jsonl"
        },
        {
          "label": "Parquet",
          "value": "parquet"
        }
      ]
    },
    {
      "name": "batch_config.storage.prefix",
      "kind": "string",
      "label": "Batch Config Storage Prefix",
      "description": "Prefix to use when writing batch files."
    },
    {
      "name": "batch_config.storage.root",
      "kind": "string",
      "label": "Batch Config Storage Root",
      "description": "Root path to use when writing batch files."
    },
    {
      "name": "database",
      "kind": "string",
      "value": "default",
      "label": "Database",
      "description": "Database name"
    },
    {
      "name": "driver",
      "kind": "options",
      "value": "http",
      "label": "Driver",
      "description": "Driver type",
      "options": [
        {
          "label": "Http",
          "value": "http"
        },
        {
          "label": "Native",
          "value": "native"
        },
        {
          "label": "Asynch",
          "value": "asynch"
        }
      ]
    },
    {
      "name": "faker_config.locale",
      "kind": "array",
      "label": "Faker Config Locale",
      "description": "One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization"
    },
    {
      "name": "faker_config.seed",
      "kind": "string",
      "label": "Faker Config Seed",
      "description": "Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator"
    },
    {
      "name": "flattening_enabled",
      "kind": "boolean",
      "label": "Flattening Enabled",
      "description": "'True' to enable schema flattening and automatically expand nested properties."
    },
    {
      "name": "flattening_max_depth",
      "kind": "integer",
      "label": "Flattening Max Depth",
      "description": "The max depth to flatten schemas."
    },
    {
      "name": "host",
      "kind": "string",
      "value": "localhost",
      "label": "Host",
      "description": "Database host"
    },
    {
      "name": "password",
      "kind": "string",
      "label": "Password",
      "description": "Username password",
      "sensitive": true
    },
    {
      "name": "port",
      "kind": "integer",
      "value": 8123,
      "label": "Port",
      "description": "Database connection port"
    },
    {
      "name": "secure",
      "kind": "boolean",
      "value": false,
      "label": "Secure",
      "description": "Should the connection be secure"
    },
    {
      "name": "stream_map_config",
      "kind": "object",
      "label": "Stream Map Config",
      "description": "User-defined config values to be used within map expressions."
    },
    {
      "name": "stream_maps",
      "kind": "object",
      "label": "Stream Maps",
      "description": "Config object for stream maps capability. For more information check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html)."
    },
    {
      "name": "username",
      "kind": "string",
      "value": "default",
      "label": "Username",
      "description": "Database user"
    },
    {
      "name": "verify",
      "kind": "boolean",
      "value": true,
      "label": "Verify",
      "description": "Should secure connection need to verify SSL/TLS"
    }
  ]
}