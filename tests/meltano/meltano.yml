default_environment: default
environments:
- name: default

plugins:

  extractors:

  - name: tap-csv
    variant: meltanolabs
    pip_url: tap-csv
    # pip_url: $WHEELER_DIR/tap-csv-1.1.0.zip

  - name: tap-clickhouse
    variant: akurdyukov
    pip_url: akurdyukov-tap-clickhouse
    #pip_url: git+https://github.com/akurdyukov/tap-clickhouse.git

  - name: tap-postgres
    variant: meltanolabs
    pip_url: meltanolabs-tap-postgres
    #pip_url: git+https://github.com/MeltanoLabs/tap-postgres.git

  - name: tap-rest-api-msdk
    variant: widen
    pip_url: tap-rest-api-msdk

  - name: tap-kafka
    variant: transferwise
    # pip_url: pipelinewise-tap-kafka pipelinewise_transform_field
    # pip_url: $WHEELER_DIR/pipelinewise-tap-kafka $WHEELER_DIR/pipelinewise_transform_field-2.3.0-py3-none-any.whl
    pip_url: pipelinewise-tap-kafka pipelinewise-singer-python
    #pip_url: C:\\Users\\ed\\work\\wheeler-create.oneimage\\.pylibs\\pipelinewise_transform_field-2.3.0-py3-none-any.whl
    #pip_url: ..\\..\\.pylibs\\pipelinewise_transform_field-2.3.0-py3-none-any.whl
    # pip_url: git+https://github.com/transferwise/pipelinewise-singer-python.git@da64a10cdbcad48ab373d4dab3d9e6dd6f58556b pipelinewise-tap-kafka

  - name: tap-s3-csv
    variant: transferwise
    pip_url: pipelinewise-tap-s3-csv

  loaders:

  - name: target-csv
    variant: meltanolabs
    pip_url: target-csv
    #pip_url: ../whl/target-csv-0.0.1.zip

  - name: target-kafka
    namespace: target_kafka
    pip_url: target-kafka
    # pip_url: git+https://github.com/reidlai/target-kafka.git
    executable: target-kafka

  - name: target-clickhouse
    variant: shaped-ai
    pip_url: shaped-target-clickhouse
    #pip_url: git+https://github.com/shaped-ai/target-clickhouse.git

  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres

  - name: target-s3-csv
    variant: transferwise
    pip_url: pipelinewise-target-s3-csv
    #pip_url: git+https://github.com/transferwise/pipelinewise-target-s3-csv.git

  mappers:

  - name: meltano-map-transformer
    variant: meltano
    pip_url: meltano-map-transform
    # pip_url: $WHEELER_DIR/meltano-map-transform-0.9.1.zip
    #pip_url: /home/ed/work/meltano-test/whl/meltano-map-transform-0.9.0.zip
    # pip_url: git+https://github.com/MeltanoLabs/meltano-map-transform.git
    executable: meltano-map-transform

  - name: transform-field
    variant: transferwise
    pip_url: pipelinewise-transform-field

auto_install: false
cli:
  log_level: debug
hub_api_root: http://localhost
hub_url_auth: http://localhost
hub_url: http://localhost
